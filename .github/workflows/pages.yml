name: Publish site and neighborhood
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preserve the existing public site
        run: |
          mkdir _site
          git archive HEAD | tar -x -C _site
      - uses: actions/checkout@v4
        with:
          repository: bacbaqui-web/our-neighborhood
          ref: a0a019ebd6ea7a07ba75b5db8a6257254d7aab2f
          path: _neighborhood
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check and build neighborhood
        working-directory: _neighborhood
        run: |
          node scripts/check-loading.mjs
          node tests/browser-generation.mjs
          python3 scripts/build-site.py
      - name: Add neighborhood without changing the main app
        run: |
          cp -R _neighborhood/dist _site/neighborhood
          touch _site/.nojekyll
          cmp index.html _site/index.html
          test -f _site/neighborhood/domestic-test/start.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
