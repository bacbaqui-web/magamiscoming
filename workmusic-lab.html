<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>노동요 분석 Lab</title>
    <link rel="stylesheet" href="styles/workmusic.css" />
    <link rel="stylesheet" href="styles/workmusic-lab.css" />
  </head>
  <body>
    <main class="workmusic-lab-shell">
      <header class="workmusic-lab-header">
        <div class="workmusic-lab-title-row">
          <h1>노동요</h1>
          <span class="workmusic-lab-kicker">기능 확인용</span>
        </div>
        <div class="workmusic-lab-local-state">
          <span>로그인 없이 이 브라우저에만 저장</span>
          <b id="workMusicLabSaveState">로컬 저장 준비</b>
        </div>
      </header>

      <form id="workMusicLabAddForm" class="workmusic-lab-add-form">
        <label for="workMusicLabUrl">YouTube 영상 또는 재생목록 링크 붙여넣기</label>
        <div>
          <input
            id="workMusicLabUrl"
            autocomplete="off"
            placeholder="https://www.youtube.com/playlist?list=..."
          />
          <button type="submit">테스트 목록 불러오기</button>
        </div>
        <p id="workMusicLabFeedback" class="workmusic-lab-feedback" aria-live="polite"></p>
      </form>

      <section class="workmusic-lab-stage">
        <section class="workmusic-lab-player-panel">
          <div class="workmusic-lab-cover-flow" aria-label="현재 곡과 이전·다음 곡 커버">
            <div class="workmusic-lab-cover far">♪</div>
            <div class="workmusic-lab-cover near">♪</div>
            <div class="workmusic-lab-cover current">
              <img id="workMusicLabThumbnail" alt="현재 곡 썸네일" />
              <span>♪</span>
            </div>
            <div class="workmusic-lab-cover near">♪</div>
            <div class="workmusic-lab-cover far">♪</div>
          </div>

          <div class="workmusic-lab-current">
            <div>
              <h2 id="workMusicLabTitle">곡을 추가해주세요</h2>
              <p id="workMusicLabArtist"></p>
            </div>
          </div>

          <div class="workmusic-player-backstage" aria-hidden="true">
            <div id="workMusicPlayerBox"></div>
          </div>

          <div class="workmusic-lab-progress-row">
            <span id="workMusicElapsedTime">0:00</span>
            <input id="workMusicSeekRange" type="range" min="0" max="1" step="0.1" value="0" />
            <span id="workMusicDurationTime">0:00</span>
          </div>

          <div class="workmusic-lab-controls" aria-label="재생 컨트롤">
            <button
              id="workMusicPrevBtn"
              class="workmusic-lab-icon-button"
              type="button"
              aria-label="이전 재생"
              title="이전 재생"
            >
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path
                  d="M6 5h2v14H6zM19 6.2v11.6c0 .8-.9 1.3-1.6.8L9.2 12l8.2-6.6c.7-.5 1.6 0 1.6.8z"
                />
              </svg>
            </button>
            <button
              id="workMusicPlayBtn"
              class="workmusic-lab-icon-button primary"
              type="button"
              aria-label="재생"
              title="재생"
            >
              <svg class="play-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M8 5v14l11-7z" />
              </svg>
              <svg class="pause-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M6 5h4v14H6zM14 5h4v14h-4z" />
              </svg>
            </button>
            <button
              id="workMusicNextBtn"
              class="workmusic-lab-icon-button"
              type="button"
              aria-label="다음 재생"
              title="다음 재생"
            >
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path
                  d="M16 5h2v14h-2zM5 6.2v11.6c0 .8.9 1.3 1.6.8l8.2-6.6-8.2-6.6c-.7-.5-1.6 0-1.6.8z"
                />
              </svg>
            </button>
            <label>
              이어듣기
              <input id="workMusicSeamlessRange" type="range" min="0" max="20" step="1" />
              <b id="workMusicSeamlessSeconds">0초</b>
            </label>
            <label>
              볼륨
              <input id="workMusicVolumeRange" type="range" min="0" max="100" step="5" />
              <b id="workMusicVolumePercent">80%</b>
            </label>
          </div>

          <section
            id="workMusicAnalysisPanel"
            class="workmusic-analysis-panel"
            aria-label="곡 분석"
          >
            <div class="workmusic-analysis-header">
              <div>
                <strong>곡 분석</strong>
                <span id="workMusicAnalysisStatus" class="workmusic-analysis-status">준비 중</span>
              </div>
              <button id="workMusicAnalyzeBtn" class="workmusic-analysis-button" type="button">
                분석
              </button>
            </div>
            <p
              id="workMusicAnalysisMessage"
              class="workmusic-analysis-message"
              aria-live="polite"
            ></p>
            <p
              id="workMusicAnalysisQueue"
              class="workmusic-analysis-message"
              aria-live="polite"
            ></p>
            <div class="workmusic-analysis-metrics" aria-label="분석 수치">
              <span>BPM <b id="workMusicAnalysisBpm">—</b></span>
              <span>신뢰도 <b id="workMusicAnalysisConfidence">—</b></span>
              <span id="workMusicAnalysisSource">구간 없음</span>
            </div>
            <div class="workmusic-analysis-timeline">
              <p class="workmusic-analysis-legend">
                짧은 선: 박자 · 긴 흰 선: 추정 마디 · 주황 선: 현재 위치
              </p>
              <div
                id="workMusicAnalysisMarkers"
                class="workmusic-analysis-markers"
                aria-label="비트와 마디 위치"
              ></div>
              <p id="workMusicAnalysisPlayback" class="workmusic-analysis-legend">재생 위치 —</p>
              <div id="workMusicDrumLane" class="workmusic-drum-lane">
                <div class="workmusic-drum-highlight" aria-hidden="true"></div>
                <input
                  id="workMusicDrumStart"
                  class="workmusic-drum-handle workmusic-drum-handle-start"
                  type="range"
                  min="0"
                  max="1"
                  step="0.1"
                  value="0"
                  aria-label="드럼 시작 위치"
                  disabled
                />
                <input
                  id="workMusicDrumEnd"
                  class="workmusic-drum-handle workmusic-drum-handle-end"
                  type="range"
                  min="0"
                  max="1"
                  step="0.1"
                  value="1"
                  aria-label="드럼 종료 위치"
                  disabled
                />
              </div>
              <span id="workMusicDrumLabel" class="workmusic-drum-label">드럼 구간 —</span>
            </div>
            <div class="workmusic-analysis-actions">
              <button id="workMusicAnalysisSaveBtn" type="button" disabled>수정 저장</button>
              <button id="workMusicAnalysisRestoreBtn" type="button" disabled>자동값 복원</button>
            </div>
          </section>

          <section
            id="workMusicBatchAnalysisPanel"
            class="workmusic-batch-analysis-panel"
            aria-label="전곡 분석"
          >
            <div class="workmusic-batch-analysis-header">
              <div>
                <strong>전곡 분석</strong>
                <span id="workMusicBatchAnalysisStatus">준비</span>
              </div>
              <div class="workmusic-batch-analysis-actions">
                <button id="workMusicBatchAnalyzeTestBtn" type="button">5곡 시험 분석</button>
                <button id="workMusicBatchAnalyzeAllBtn" type="button">전곡 분석</button>
                <button id="workMusicBatchStopBtn" type="button" disabled>중단</button>
                <button id="workMusicBatchResumeBtn" type="button" disabled>재개</button>
              </div>
            </div>
            <p id="workMusicBatchAnalysisMessage" aria-live="polite">
              먼저 5곡 시험 분석을 실행해주세요.
            </p>
            <progress id="workMusicBatchAnalysisProgress" max="1" value="0"></progress>
            <span id="workMusicBatchAnalysisCounts">완료 0 · 대기 0 · 진행 0 · 실패 0</span>
          </section>
        </section>

        <aside class="workmusic-lab-list-panel">
          <div class="workmusic-lab-section-title">
            <h2>재생 목록</h2>
            <span id="workMusicLabCount">0곡</span>
          </div>
          <div id="workMusicLabList" class="workmusic-lab-list"></div>
        </aside>
      </section>
    </main>
    <script src="src/config.js"></script>
    <script type="module" src="src/lab/workMusicLab.js?v=batch-analysis-1"></script>
  </body>
</html>
